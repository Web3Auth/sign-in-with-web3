name: Security code scanner

# GitHub code scanning already runs CodeQL for this repository.
# This workflow adds Semgrep once and does not start a second CodeQL analysis.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Semgrep OSS
        run: python -m pip install 'setuptools<81' semgrep==1.183.0
      - name: Scan JavaScript and TypeScript
        run: semgrep scan --error --config p/javascript --config p/typescript --exclude '**/node_modules/**' --exclude '**/dist/**' --exclude '**/build/**' --exclude '**/coverage/**' .
