name: Build & Release

on: [push]

jobs:
  test:
    strategy:
      matrix:
        node: ["24.x"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Wiz sensor
        uses: Web3Auth/.github/.github/actions/wiz-sensor@2f62f5725c0aa2bbdf6ad947dbe589d44665f58c # feat/wiz-sensor-action
        with:
          enabled: ${{ vars.WIZ_SENSOR_ENABLED }}
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run Build
        run: npm run build

      - name: Install playwright webkit
        run: npx playwright install-deps webkit

      - name: Run tests
        run: npx playwright install && npm run test
