name: Build & Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    strategy:
      matrix:
        node: ["24.22.0", "26"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Wiz sensor
        uses: Web3Auth/.github/.github/actions/wiz-sensor@545f7c255313f85d38a02dc36c4ad01387d03149 # v1.0.0
        with:
          enabled: ${{ vars.WIZ_SENSOR_ENABLED }}
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Use npm 12
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Harden check
        run: npx harden check --level moderate -p npm

      - name: Run Build
        run: npm run build

      - name: Install playwright webkit
        run: npx playwright install-deps webkit

      - name: Run tests
        run: npx playwright install && npm run test

  release-notes:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.0"
          cache: "npm"

      - name: Use npm 12
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Check release notes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          npm exec -- changeset status --since="origin/${BASE_REF}"
